<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アルロッド素材作成ツール V3</title>
<style>
:root{--bg:#151515;--panel:#222;--line:#3b3b3b;--text:#fff;--muted:#bbb;--accent:#ff9800;--danger:#d93025;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{padding:14px 18px;background:#202020;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.version{font-size:12px;color:#ddd;background:#333;padding:4px 8px;border-radius:999px}main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;height:calc(100vh - 58px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.controls{overflow:auto}label{display:block;margin-top:13px;font-weight:800;font-size:14px}input,button{width:100%;margin-top:6px;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff;font-size:14px}button{border:0;cursor:pointer;background:var(--accent);color:#111;font-weight:900}button:hover{filter:brightness(1.08)}button.secondary{background:#444;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.hint{color:var(--muted);font-size:12px;line-height:1.55}.value{float:right;color:#ffd28a;font-weight:900}#status{margin-top:12px;padding:10px;background:#111;border:1px solid #444;border-radius:10px;color:#ffd28a;font-weight:800;font-size:13px;line-height:1.5}#stage{overflow:hidden;position:relative;min-width:0;min-height:0;padding:0}#canvasWrap{width:100%;height:100%;overflow:auto;position:relative;background:#101010}canvas{display:block;margin:20px auto;background:linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;box-shadow:0 10px 30px rgba(0,0,0,.35);transform-origin:center center}.kbd{display:inline-block;background:#111;border:1px solid #555;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;color:#eee}@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}}
</style>
</head>
<body>
<header><h1>アルロッド素材作成ツール</h1><span class="version">V3 / AI切り抜き・白フチ・黒影</span></header>
<main>
<section class="panel controls">
<label>1. 画像読み込み</label><input type="file" id="file" accept="image/*">
<div class="row" style="margin-top:10px"><button id="aiCut">AI背景削除</button><button class="secondary" id="resetToLoaded">元画像に戻す</button></div><hr>
<label>2. ブラシ編集</label><div class="row"><button class="secondary" id="eraseMode">消しゴム</button><button class="secondary" id="restoreMode">復元ブラシ</button></div>
<label>ブラシサイズ <span class="value" id="brushVal">35px</span></label><input type="range" id="brush" min="3" max="180" value="35">
<div class="row" style="margin-top:10px"><button class="secondary" id="undo">1つ戻す</button><button class="secondary" id="redo">1つ進む</button></div><hr>
<label>3. 白フチ・黒影</label><label>白フチサイズ <span class="value" id="outlineVal">28px</span></label><input type="range" id="outline" min="0" max="90" value="28">
<label>黒影サイズ <span class="value" id="shadowVal">18px</span></label><input type="range" id="shadow" min="0" max="80" value="18">
<label>黒影の濃さ <span class="value" id="shadowAlphaVal">70%</span></label><input type="range" id="shadowAlpha" min="0" max="100" value="70">
<label>影のズレ <span class="value" id="shadowOffsetVal">10px</span></label><input type="range" id="shadowOffset" min="0" max="50" value="10">
<div class="row" style="margin-top:10px"><button id="commitFx">今のフチを確定</button><button class="secondary" id="clearFx">フチなし表示</button></div><hr>
<label>4. 表示</label><label>ズーム <span class="value" id="zoomVal">100%</span></label><input type="range" id="zoom" min="20" max="250" value="100">
<div class="row3" style="margin-top:10px"><button class="secondary" id="zoomOut">－</button><button class="secondary" id="zoomReset">100%</button><button class="secondary" id="zoomIn">＋</button></div><hr>
<label>5. 保存</label><button id="download">透過PNG保存</button><div id="status">画像を読み込んでください。</div>
<p class="hint">ショートカット：<span class="kbd">Ctrl</span> + <span class="kbd">Z</span> 戻る / <span class="kbd">Ctrl</span> + <span class="kbd">Y</span> 進む / <span class="kbd">E</span> 消しゴム / <span class="kbd">R</span> 復元ブラシ</p>
<p class="hint">初回のAI背景削除はモデル読み込みで時間がかかります。ローカルで動かない場合はGitHub PagesかLive Serverで開いてください。</p>
</section>
<section id="stage" class="panel"><div id="canvasWrap"><canvas id="canvas"></canvas></div></section>
</main>
<script type="module">
let removeBackgroundFn=null;async function loadRemoveBg(){if(removeBackgroundFn)return removeBackgroundFn;const urls=["https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser.mjs","https://esm.sh/@imgly/background-removal","https://esm.run/@imgly/background-removal"];for(const url of urls){try{const mod=await import(url);if(mod.removeBackground){removeBackgroundFn=mod.removeBackground;return removeBackgroundFn}}catch(e){console.warn("AIライブラリ読み込み失敗:",url,e)}}throw new Error("AI背景削除ライブラリを読み込めませんでした。")}
const $=id=>document.getElementById(id),file=$("file"),canvas=$("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true}),statusEl=$("status");let loadedFile=null,loadedOriginal=null,restoreBase=null,cutoutBase=null,current=null,history=[],redoStack=[],brushMode="erase",painting=false,previewTimer=null;function setStatus(t){statusEl.textContent=t}function cloneImageData(d){return new ImageData(new Uint8ClampedArray(d.data),d.width,d.height)}function pushHistory(){if(!cutoutBase)return;history.push(cloneImageData(cutoutBase));if(history.length>50)history.shift();redoStack=[]}function setCanvasFromImageData(d){canvas.width=d.width;canvas.height=d.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.putImageData(d,0,0);current=ctx.getImageData(0,0,canvas.width,canvas.height)}function updateLabels(){$("brushVal").textContent=`${$("brush").value}px`;$('outlineVal').textContent=`${$('outline').value}px`;$('shadowVal').textContent=`${$('shadow').value}px`;$('shadowAlphaVal').textContent=`${$('shadowAlpha').value}%`;$('shadowOffsetVal').textContent=`${$('shadowOffset').value}px`;$('zoomVal').textContent=`${$('zoom').value}%`} ["brush","outline","shadow","shadowAlpha","shadowOffset","zoom"].forEach(id=>$(id).addEventListener("input",updateLabels));updateLabels();function applyZoom(){canvas.style.transform=`scale(${Number($("zoom").value)/100})`;updateLabels()}$("zoom").addEventListener("input",applyZoom);$("zoomReset").onclick=()=>{$("zoom").value=100;applyZoom()};$("zoomIn").onclick=()=>{$("zoom").value=Math.min(250,Number($("zoom").value)+10);applyZoom()};$("zoomOut").onclick=()=>{$("zoom").value=Math.max(20,Number($("zoom").value)-10);applyZoom()};
file.onchange=e=>{loadedFile=e.target.files[0];if(!loadedFile)return;const img=new Image();img.onload=()=>{const max=1800,scale=Math.min(1,max/img.width);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);loadedOriginal=ctx.getImageData(0,0,canvas.width,canvas.height);restoreBase=cloneImageData(loadedOriginal);cutoutBase=cloneImageData(loadedOriginal);current=cloneImageData(loadedOriginal);history=[];redoStack=[];$("zoom").value=100;applyZoom();setStatus("画像読み込み完了。AI背景削除を押してください。")};img.onerror=()=>setStatus("画像の読み込みに失敗しました。");img.src=URL.createObjectURL(loadedFile)};
$("resetToLoaded").onclick=()=>{if(!loadedOriginal)return;pushHistory();restoreBase=cloneImageData(loadedOriginal);cutoutBase=cloneImageData(loadedOriginal);setCanvasFromImageData(cutoutBase);setStatus("元画像に戻しました。")};
$("aiCut").onclick=async()=>{if(!loadedFile){alert("先に画像を読み込んでください。");return}pushHistory();setStatus("AI背景削除の準備中... 初回は少し時間がかかります。");try{const removeBackground=await loadRemoveBg();setStatus("AI背景削除中... しばらく待ってください。");const blob=await removeBackground(loadedFile);const img=new Image();img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);const result=ctx.getImageData(0,0,canvas.width,canvas.height);const origImg=new Image();origImg.onload=()=>{const temp=document.createElement("canvas");temp.width=img.width;temp.height=img.height;const tctx=temp.getContext("2d");tctx.drawImage(origImg,0,0,temp.width,temp.height);restoreBase=tctx.getImageData(0,0,temp.width,temp.height);cutoutBase=cloneImageData(result);current=cloneImageData(result);previewFx();setStatus("AI背景削除完了。白フチ・黒影はスライダーで調整できます。")};origImg.src=URL.createObjectURL(loadedFile)};img.onerror=()=>setStatus("AI背景削除後の画像表示に失敗しました。");img.src=URL.createObjectURL(blob)}catch(err){console.error(err);setStatus("AI背景削除に失敗しました。GitHub PagesまたはLive Serverで開いて試してください。");alert("AI背景削除に失敗しました。GitHub PagesかLive Serverで試してください。")}};
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width),y:Math.floor((e.clientY-r.top)*canvas.height/r.height)}}function paintAt(x,y){if(!cutoutBase||!restoreBase)return;const size=Number($("brush").value),w=cutoutBase.width,h=cutoutBase.height,d=cutoutBase.data,o=restoreBase.data;for(let yy=y-size;yy<=y+size;yy++){if(yy<0||yy>=h)continue;for(let xx=x-size;xx<=x+size;xx++){if(xx<0||xx>=w)continue;if((xx-x)**2+(yy-y)**2>size*size)continue;const i=(yy*w+xx)*4;if(brushMode==="erase")d[i+3]=0;else{d[i]=o[i];d[i+1]=o[i+1];d[i+2]=o[i+2];d[i+3]=255}}}previewFx(false)}canvas.onpointerdown=e=>{if(!cutoutBase)return;pushHistory();painting=true;const p=pos(e);paintAt(p.x,p.y)};canvas.onpointermove=e=>{if(!painting)return;const p=pos(e);paintAt(p.x,p.y)};window.onpointerup=()=>painting=false;$("eraseMode").onclick=()=>{brushMode="erase";setStatus("消しゴムモードです。")};$("restoreMode").onclick=()=>{brushMode="restore";setStatus("復元ブラシモードです。")};
function undo(){if(!history.length)return;if(cutoutBase)redoStack.push(cloneImageData(cutoutBase));cutoutBase=history.pop();previewFx();setStatus("1つ戻しました。")}function redo(){if(!redoStack.length)return;if(cutoutBase)history.push(cloneImageData(cutoutBase));cutoutBase=redoStack.pop();previewFx();setStatus("1つ進めました。")}$("undo").onclick=undo;$("redo").onclick=redo;window.addEventListener("keydown",e=>{const key=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&key==="z"){e.preventDefault();undo()}else if((e.ctrlKey||e.metaKey)&&(key==="y"||(e.shiftKey&&key==="z"))){e.preventDefault();redo()}else if(!e.ctrlKey&&!e.metaKey&&key==="e"){brushMode="erase";setStatus("消しゴムモードです。")}else if(!e.ctrlKey&&!e.metaKey&&key==="r"){brushMode="restore";setStatus("復元ブラシモードです。")}});
function createFxCanvas(base){const w=base.width,h=base.height,outline=Number($("outline").value),shadow=Number($("shadow").value),shadowAlpha=Number($("shadowAlpha").value)/100,shadowOffset=Number($("shadowOffset").value),src=document.createElement("canvas");src.width=w;src.height=h;src.getContext("2d").putImageData(base,0,0);const pad=outline+shadow+shadowOffset+4,out=document.createElement("canvas");out.width=w+pad*2;out.height=h+pad*2;const c=out.getContext("2d"),ox=pad,oy=pad;if(shadow>0&&shadowAlpha>0){c.save();c.filter=`blur(${Math.max(1,Math.round(shadow/2))}px)`;c.globalAlpha=shadowAlpha;c.drawImage(src,ox+shadowOffset,oy+shadowOffset);c.globalCompositeOperation="source-in";c.fillStyle="black";c.fillRect(0,0,out.width,out.height);c.restore()}if(outline>0){const white=document.createElement("canvas");white.width=w;white.height=h;const wc=white.getContext("2d");wc.drawImage(src,0,0);wc.globalCompositeOperation="source-in";wc.fillStyle="white";wc.fillRect(0,0,w,h);for(let a=0;a<360;a+=4){const rad=a*Math.PI/180;for(let r=2;r<=outline;r+=2)c.drawImage(white,ox+Math.cos(rad)*r,oy+Math.sin(rad)*r)}}c.drawImage(src,ox,oy);return out}function previewFx(showStatus=true){if(!cutoutBase)return;clearTimeout(previewTimer);previewTimer=setTimeout(()=>{const out=createFxCanvas(cutoutBase);canvas.width=out.width;canvas.height=out.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(out,0,0);current=ctx.getImageData(0,0,canvas.width,canvas.height);if(showStatus)setStatus("白フチ・黒影をプレビュー中です。")},35)}["outline","shadow","shadowAlpha","shadowOffset"].forEach(id=>$(id).addEventListener("input",()=>{updateLabels();previewFx()}));$("clearFx").onclick=()=>{if(!cutoutBase)return;setCanvasFromImageData(cutoutBase);setStatus("フチなし表示にしました。")};$("commitFx").onclick=()=>{if(!current)return;pushHistory();cutoutBase=cloneImageData(current);restoreBase=cloneImageData(current);setCanvasFromImageData(cutoutBase);$("outline").value=0;$("shadow").value=0;updateLabels();setStatus("白フチ・黒影を確定しました。")};$("download").onclick=()=>{if(!current){alert("先に画像を読み込んでください。");return}const out=cutoutBase?createFxCanvas(cutoutBase):canvas,a=document.createElement("a");a.download="alrod_asset_cutout.png";a.href=out.toDataURL("image/png");a.click();setStatus("透過PNGを保存しました。")};
</script>
</body>
</html>
