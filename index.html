<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>アルロッド サムネメーカー V1</title>
<style>
:root{--bg:#151515;--panel:#222;--line:#3a3a3a;--text:#fff;--muted:#bbb;--accent:#ff9800;--danger:#d93025;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans JP","Yu Gothic",sans-serif}
header{height:58px;padding:12px 18px;background:#202020;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}.badge{font-size:12px;background:#333;padding:4px 8px;border-radius:999px}
main{height:calc(100vh - 58px);display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.controls{overflow:auto}label{display:block;margin-top:13px;font-size:14px;font-weight:800}
input,button,textarea,select{width:100%;margin-top:6px;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:white}
textarea{min-height:70px;resize:vertical}
button{border:0;background:var(--accent);color:#111;font-weight:900;cursor:pointer}button.secondary{background:#444;color:white}.danger{background:var(--danger)!important;color:white!important}.blue{background:var(--blue)!important;color:#fff!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
small,.hint{color:var(--muted);font-size:12px;line-height:1.55}.value{float:right;color:#ffd28a;font-weight:900}
.checkRow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;background:#151515;border:1px solid #444;border-radius:10px}
.checkRow input{width:auto;margin:0;transform:scale(1.35)}.checkRow label{margin:0;font-size:14px}
#status,#thumbStatus{margin-top:12px;padding:10px;border:1px solid #444;border-radius:10px;background:#111;color:#ffd28a;font-weight:800;font-size:13px;line-height:1.5}
#stage{padding:0;overflow:hidden}#canvasWrap{width:100%;height:100%;overflow:auto;background:#101010}
canvas{display:block;margin:24px auto;box-shadow:0 10px 30px rgba(0,0,0,.35);transform-origin:center center;touch-action:none}
.canvasTransparent{background:linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.canvasWhite{background:#fff}.modeOn{outline:3px solid #ffd28a}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{background:#333;color:#fff}.tab.active{background:var(--accent);color:#111}
.kbd{display:inline-block;background:#111;border:1px solid #555;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;color:#eee}
#thumbCanvas{background:#111}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}}
</style>
</head>
<body>
<header><h1>アルロッド サムネメーカー</h1><span class="badge">V1 / 素材透過 + 自動サムネ</span></header>

<main>
<section class="panel controls">
  <div class="tabs">
    <button class="tab active" id="tabCut">① キャラ素材透過</button>
    <button class="tab" id="tabThumb">② サムネ自動作成</button>
  </div>

  <div id="cutPanel">
    <label>1. 画像読み込み</label>
    <input type="file" id="file" accept="image/*">
    <div class="row" style="margin-top:10px">
      <button id="aiCut">AI背景削除</button>
      <button class="secondary" id="resetToLoaded">元画像に戻す</button>
    </div>

    <hr>
    <label>2. ブラシ編集</label>
    <div class="row">
      <button class="secondary modeOn" id="eraseMode">消しゴム</button>
      <button class="secondary" id="restoreMode">復元ブラシ</button>
    </div>
    <label>ブラシサイズ <span class="value" id="brushVal">35px</span></label>
    <input type="range" id="brush" min="3" max="180" value="35">
    <div class="row" style="margin-top:10px">
      <button class="secondary" id="undo">1つ戻す</button>
      <button class="secondary" id="redo">1つ進む</button>
    </div>

    <hr>
    <label>3. 仕上げ効果</label>
    <div class="checkRow"><input type="checkbox" id="useOutline"><label for="useOutline">白フチを追加する</label></div>
    <label>白フチサイズ <span class="value" id="outlineVal">28px</span></label>
    <input type="range" id="outline" min="0" max="90" value="28">
    <div class="checkRow"><input type="checkbox" id="useShadow"><label for="useShadow">黒影を追加する</label></div>
    <label>黒影サイズ <span class="value" id="shadowVal">18px</span></label>
    <input type="range" id="shadow" min="0" max="80" value="18">
    <label>黒影の濃さ <span class="value" id="shadowAlphaVal">70%</span></label>
    <input type="range" id="shadowAlpha" min="0" max="100" value="70">
    <label>影のズレ <span class="value" id="shadowOffsetVal">10px</span></label>
    <input type="range" id="shadowOffset" min="0" max="50" value="10">

    <hr>
    <label>4. 背景プレビュー</label>
    <div class="row">
      <button class="secondary modeOn" id="bgTransparent">透過表示</button>
      <button class="secondary" id="bgWhite">真っ白表示</button>
    </div>

    <hr>
    <label>5. 表示</label>
    <label>ズーム <span class="value" id="zoomVal">100%</span></label>
    <input type="range" id="zoom" min="20" max="250" value="100">
    <div class="row3" style="margin-top:10px">
      <button class="secondary" id="zoomOut">－</button>
      <button class="secondary" id="zoomReset">100%</button>
      <button class="secondary" id="zoomIn">＋</button>
    </div>

    <hr>
    <label>6. 保存</label>
    <button id="download">透過PNG保存</button>
    <div id="status">画像を読み込んでください。</div>
    <p class="hint"><span class="kbd">Ctrl</span>+<span class="kbd">Z</span> 戻る / <span class="kbd">Ctrl</span>+<span class="kbd">Y</span> 進む / <span class="kbd">E</span> 消しゴム / <span class="kbd">R</span> 復元</p>
  </div>

  <div id="thumbPanel" style="display:none">
    <label>1. 背景素材（複数選択可）</label>
    <input type="file" id="bgFiles" accept="image/*" multiple>
    <small>1枚なら全面背景。複数なら自動で背景コラージュにします。</small>

    <label>2. キャラ・ロゴ素材（複数選択可）</label>
    <input type="file" id="assetFiles" accept="image/*" multiple>
    <small>1つ目の機能で保存した透過PNGもここに入れられます。</small>

    <hr>
    <label>入れたい内容</label>
    <input id="smallText" placeholder="例：新規住民" value="新規住民">
    <input id="mainText" placeholder="例：どのエリアを狙う？" value="どのエリアを狙う？">
    <input id="subText" placeholder="例：まだ色んな色がある" value="まだ色んな色がある">
    <input id="nameText" placeholder="例：アル・ロドンドロン" value="アル・ロドンドロン">

    <label>テンプレート</label>
    <select id="template">
      <option value="auto">自動おすすめ</option>
      <option value="leftCharacter">キャラ左・文字右</option>
      <option value="centerCharacter">キャラ中央・文字上下</option>
      <option value="mapFocus">背景重視・文字大きめ</option>
    </select>

    <div class="row" style="margin-top:12px">
      <button id="makeThumb">サムネ作成</button>
      <button class="secondary" id="randomizeThumb">別パターン</button>
    </div>

    <label>仕上げ</label>
    <div class="checkRow"><input type="checkbox" id="thumbDark" checked><label for="thumbDark">背景を少し暗くして文字を見やすく</label></div>
    <div class="checkRow"><input type="checkbox" id="thumbVignette" checked><label for="thumbVignette">周辺を暗くする</label></div>

    <hr>
    <button id="downloadThumb">サムネPNG保存（1280×720）</button>
    <div id="thumbStatus">背景と素材を読み込んでください。</div>
  </div>
</section>

<section id="stage" class="panel">
  <div id="canvasWrap">
    <canvas id="canvas" class="canvasTransparent"></canvas>
    <canvas id="thumbCanvas" width="1280" height="720" style="display:none"></canvas>
  </div>
</section>
</main>

<script type="module">
let removeBackgroundFn=null;
async function loadRemoveBg(){
  if(removeBackgroundFn)return removeBackgroundFn;
  const urls=[
    "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser.mjs",
    "https://esm.sh/@imgly/background-removal",
    "https://esm.run/@imgly/background-removal"
  ];
  for(const url of urls){
    try{const mod=await import(url); if(mod.removeBackground){removeBackgroundFn=mod.removeBackground;return removeBackgroundFn;}}
    catch(e){console.warn("AI読み込み失敗",url,e);}
  }
  throw new Error("AI背景削除ライブラリを読み込めませんでした");
}

const $=id=>document.getElementById(id);
const canvas=$("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true}), statusEl=$("status");
const thumbCanvas=$("thumbCanvas"), tctx=thumbCanvas.getContext("2d");
let loadedFile=null, loadedOriginal=null, restoreBase=null, cutoutBase=null, current=null;
let history=[], redoStack=[], brushMode="erase", painting=false, previewTimer=null, renderMeta={pad:0,scale:1};
let thumbSeed=0;

function setActiveTool(name){
  const cut=name==="cut";
  $("tabCut").classList.toggle("active",cut); $("tabThumb").classList.toggle("active",!cut);
  $("cutPanel").style.display=cut?"block":"none"; $("thumbPanel").style.display=cut?"none":"block";
  canvas.style.display=cut?"block":"none"; thumbCanvas.style.display=cut?"none":"block";
}
$("tabCut").onclick=()=>setActiveTool("cut");
$("tabThumb").onclick=()=>setActiveTool("thumb");

function setStatus(t){statusEl.textContent=t;}
function cloneImageData(d){return new ImageData(new Uint8ClampedArray(d.data),d.width,d.height);}
function updateLabels(){
  $("brushVal").textContent=$("brush").value+"px"; $("outlineVal").textContent=$("outline").value+"px";
  $("shadowVal").textContent=$("shadow").value+"px"; $("shadowAlphaVal").textContent=$("shadowAlpha").value+"%";
  $("shadowOffsetVal").textContent=$("shadowOffset").value+"px"; $("zoomVal").textContent=$("zoom").value+"%";
}
["brush","outline","shadow","shadowAlpha","shadowOffset","zoom"].forEach(id=>$(id).addEventListener("input",updateLabels)); updateLabels();

function setPreviewBackground(type){
  canvas.classList.toggle("canvasTransparent", type==="transparent");
  canvas.classList.toggle("canvasWhite", type==="white");
  $("bgTransparent").classList.toggle("modeOn", type==="transparent");
  $("bgWhite").classList.toggle("modeOn", type==="white");
  setStatus(type==="white" ? "背景を真っ白表示にしました。保存PNGは透過のままです。" : "背景を透過チェック表示にしました。");
}
$("bgTransparent").onclick=()=>setPreviewBackground("transparent");
$("bgWhite").onclick=()=>setPreviewBackground("white");

function applyZoom(){canvas.style.transform=`scale(${Number($("zoom").value)/100})`;updateLabels();}
$("zoom").addEventListener("input",applyZoom);
$("zoomReset").onclick=()=>{$("zoom").value=100;applyZoom();};
$("zoomIn").onclick=()=>{$("zoom").value=Math.min(250,Number($("zoom").value)+10);applyZoom();};
$("zoomOut").onclick=()=>{$("zoom").value=Math.max(20,Number($("zoom").value)-10);applyZoom();};

function pushHistory(){if(!cutoutBase)return;history.push(cloneImageData(cutoutBase));if(history.length>60)history.shift();redoStack=[];}
function undo(){if(!history.length)return;if(cutoutBase)redoStack.push(cloneImageData(cutoutBase));cutoutBase=history.pop();previewFx(true);setStatus("1つ戻しました。");}
function redo(){if(!redoStack.length)return;if(cutoutBase)history.push(cloneImageData(cutoutBase));cutoutBase=redoStack.pop();previewFx(true);setStatus("1つ進めました。");}
$("undo").onclick=undo;$("redo").onclick=redo;

function setMode(m){brushMode=m;$("eraseMode").classList.toggle("modeOn",m==="erase");$("restoreMode").classList.toggle("modeOn",m==="restore");setStatus(m==="erase"?"消しゴムモードです。":"復元ブラシモードです。");}
$("eraseMode").onclick=()=>setMode("erase"); $("restoreMode").onclick=()=>setMode("restore");
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k==="y"||(e.shiftKey&&k==="z"))){e.preventDefault();redo();}
  else if(!e.ctrlKey&&!e.metaKey&&k==="e")setMode("erase");
  else if(!e.ctrlKey&&!e.metaKey&&k==="r")setMode("restore");
});

$("file").onchange=e=>{
  loadedFile=e.target.files[0]; if(!loadedFile)return;
  const img=new Image();
  img.onload=()=>{
    const max=1800,scale=Math.min(1,max/img.width);
    canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height);
    loadedOriginal=ctx.getImageData(0,0,canvas.width,canvas.height);
    restoreBase=cloneImageData(loadedOriginal); cutoutBase=cloneImageData(loadedOriginal);
    history=[];redoStack=[]; previewFx(false); $("zoom").value=100;applyZoom();
    setStatus("画像読み込み完了。AI背景削除を押してください。");
  };
  img.onerror=()=>setStatus("画像読み込みに失敗しました。");
  img.src=URL.createObjectURL(loadedFile);
};

$("resetToLoaded").onclick=()=>{if(!loadedOriginal)return;pushHistory();restoreBase=cloneImageData(loadedOriginal);cutoutBase=cloneImageData(loadedOriginal);previewFx(false);setStatus("元画像に戻しました。");};

$("aiCut").onclick=async()=>{
  if(!loadedFile){alert("先に画像を読み込んでください。");return;}
  pushHistory(); setStatus("AI背景削除の準備中... 初回は少し時間がかかります。");
  try{
    const removeBackground=await loadRemoveBg(); setStatus("AI背景削除中... しばらく待ってください。");
    const blob=await removeBackground(loadedFile);
    const img=new Image();
    img.onload=()=>{
      const resultCanvas=document.createElement("canvas"); resultCanvas.width=img.width; resultCanvas.height=img.height;
      const rctx=resultCanvas.getContext("2d"); rctx.drawImage(img,0,0);
      const result=rctx.getImageData(0,0,img.width,img.height);
      const origImg=new Image();
      origImg.onload=()=>{
        const temp=document.createElement("canvas"); temp.width=img.width; temp.height=img.height;
        const tctx=temp.getContext("2d"); tctx.drawImage(origImg,0,0,temp.width,temp.height);
        restoreBase=tctx.getImageData(0,0,temp.width,temp.height);
        cutoutBase=cloneImageData(result); previewFx(false);
        setStatus("AI背景削除完了。ブラシで調整後、必要なら白フチ/黒影にチェックを入れてください。");
      };
      origImg.src=URL.createObjectURL(loadedFile);
    };
    img.onerror=()=>setStatus("AI背景削除後の画像表示に失敗しました。");
    img.src=URL.createObjectURL(blob);
  }catch(err){console.error(err); setStatus("AI背景削除に失敗しました。GitHub PagesかLive Serverで開いてください。"); alert("AI背景削除に失敗しました。GitHub PagesかLive Serverで開いてください。");}
};

function createFxCanvas(base){
  const w=base.width,h=base.height;
  const useOutline=$("useOutline").checked, useShadow=$("useShadow").checked;
  const outline=useOutline ? Number($("outline").value) : 0;
  const shadow=useShadow ? Number($("shadow").value) : 0;
  const alpha=useShadow ? Number($("shadowAlpha").value)/100 : 0;
  const offset=useShadow ? Number($("shadowOffset").value) : 0;
  const pad=outline+shadow+offset+6;

  const src=document.createElement("canvas"); src.width=w;src.height=h; src.getContext("2d").putImageData(base,0,0);
  const out=document.createElement("canvas"); out.width=w+pad*2;out.height=h+pad*2; const c=out.getContext("2d");

  if(shadow>0&&alpha>0){
    c.save(); c.filter=`blur(${Math.max(1,Math.round(shadow/2))}px)`; c.globalAlpha=alpha;
    c.drawImage(src,pad+offset,pad+offset); c.globalCompositeOperation="source-in"; c.fillStyle="black"; c.fillRect(0,0,out.width,out.height); c.restore();
  }
  if(outline>0){
    const white=document.createElement("canvas"); white.width=w;white.height=h;
    const wc=white.getContext("2d"); wc.drawImage(src,0,0); wc.globalCompositeOperation="source-in"; wc.fillStyle="white"; wc.fillRect(0,0,w,h);
    for(let a=0;a<360;a+=4){const rad=a*Math.PI/180;for(let r=2;r<=outline;r+=2)c.drawImage(white,pad+Math.cos(rad)*r,pad+Math.sin(rad)*r);}
  }
  c.drawImage(src,pad,pad);
  return {canvas:out,pad};
}

function previewFx(showStatus=true){
  if(!cutoutBase)return;
  clearTimeout(previewTimer);
  previewTimer=setTimeout(()=>{
    const fx=createFxCanvas(cutoutBase);
    canvas.width=fx.canvas.width;canvas.height=fx.canvas.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(fx.canvas,0,0);
    current=ctx.getImageData(0,0,canvas.width,canvas.height);
    renderMeta={pad:fx.pad,scale:1};
    if(showStatus)setStatus("仕上げ効果をプレビュー中です。");
  },30);
}
["useOutline","useShadow","outline","shadow","shadowAlpha","shadowOffset"].forEach(id=>$(id).addEventListener("input",()=>{updateLabels();previewFx(true);}));
["useOutline","useShadow"].forEach(id=>$(id).addEventListener("change",()=>{previewFx(true);}));

function eventToBasePos(e){
  const rect=canvas.getBoundingClientRect();
  const canvasX=(e.clientX-rect.left)*canvas.width/rect.width;
  const canvasY=(e.clientY-rect.top)*canvas.height/rect.height;
  return {x:Math.floor(canvasX-renderMeta.pad),y:Math.floor(canvasY-renderMeta.pad)};
}
function paintAt(x,y){
  if(!cutoutBase||!restoreBase)return;
  const size=Number($("brush").value), w=cutoutBase.width, h=cutoutBase.height, d=cutoutBase.data, o=restoreBase.data;
  for(let yy=y-size;yy<=y+size;yy++){
    if(yy<0||yy>=h)continue;
    for(let xx=x-size;xx<=x+size;xx++){
      if(xx<0||xx>=w)continue;
      if((xx-x)**2+(yy-y)**2>size*size)continue;
      const i=(yy*w+xx)*4;
      if(brushMode==="erase")d[i+3]=0;
      else{d[i]=o[i];d[i+1]=o[i+1];d[i+2]=o[i+2];d[i+3]=255;}
    }
  }
  previewFx(false);
}
canvas.addEventListener("pointerdown",e=>{if(!cutoutBase)return;pushHistory();painting=true;canvas.setPointerCapture(e.pointerId);const p=eventToBasePos(e);paintAt(p.x,p.y);});
canvas.addEventListener("pointermove",e=>{if(!painting)return;const p=eventToBasePos(e);paintAt(p.x,p.y);});
window.addEventListener("pointerup",()=>painting=false);

$("download").onclick=()=>{
  if(!cutoutBase){alert("先に画像を読み込んでください。");return;}
  const fx=createFxCanvas(cutoutBase);
  const a=document.createElement("a"); a.download="alrod_asset_cutout.png"; a.href=fx.canvas.toDataURL("image/png"); a.click();
  setStatus("透過PNGを保存しました。");
};

// Thumbnail maker
async function readImages(input){
  const files=[...input.files];
  return await Promise.all(files.map(file=>new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve({img,file});
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  })));
}
function coverDraw(c,img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height);
  const dw=img.width*s, dh=img.height*s;
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function containDraw(c,img,x,y,w,h){
  const s=Math.min(w/img.width,h/img.height);
  const dw=img.width*s, dh=img.height*s;
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function drawTextFit(c,text,x,y,maxW,maxSize,minSize,fill,stroke,align="left"){
  if(!text)return;
  let size=maxSize;
  c.textAlign=align;
  c.textBaseline="top";
  do{
    c.font=`900 ${size}px "Noto Sans JP","Yu Gothic",sans-serif`;
    if(c.measureText(text).width<=maxW)break;
    size-=4;
  }while(size>minSize);
  c.lineJoin="round";
  c.strokeStyle=stroke;
  c.lineWidth=Math.max(8,Math.floor(size/7));
  c.strokeText(text,x,y);
  c.fillStyle=fill;
  c.fillText(text,x,y);
}
function drawLabel(c,text,x,y,w,h,bg,fg="#fff"){
  if(!text)return;
  c.save();
  c.fillStyle=bg;
  c.strokeStyle="#fff";
  c.lineWidth=5;
  roundRect(c,x,y,w,h,16,true,true);
  c.font=`900 ${Math.floor(h*0.55)}px "Noto Sans JP","Yu Gothic",sans-serif`;
  c.textAlign="center";c.textBaseline="middle";
  c.strokeStyle="#111";c.lineWidth=8;c.strokeText(text,x+w/2,y+h/2+1);
  c.fillStyle=fg;c.fillText(text,x+w/2,y+h/2+1);
  c.restore();
}
function roundRect(c,x,y,w,h,r,fill,stroke){
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);
  if(fill)c.fill(); if(stroke)c.stroke();
}
function drawVignette(c){
  const g=c.createRadialGradient(640,360,180,640,360,760);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(0,0,0,.65)");
  c.fillStyle=g;c.fillRect(0,0,1280,720);
}
async function makeThumbnail(){
  const bgs=await readImages($("bgFiles"));
  const assets=await readImages($("assetFiles"));
  if(!bgs.length){alert("背景素材を読み込んでください。");return;}
  const tpl=$("template").value==="auto" ? ["leftCharacter","centerCharacter","mapFocus"][thumbSeed%3] : $("template").value;
  tctx.clearRect(0,0,1280,720);

  // background
  coverDraw(tctx,bgs[0].img,0,0,1280,720);
  if(bgs.length>1){
    tctx.save();
    tctx.globalAlpha=.55;
    const w=360,h=210;
    for(let i=1;i<Math.min(bgs.length,4);i++){
      const x=1280-w-30, y=30+(i-1)*(h+18);
      tctx.save();tctx.shadowColor="rgba(0,0,0,.7)";tctx.shadowBlur=18;
      tctx.fillStyle="#111";roundRect(tctx,x-5,y-5,w+10,h+10,18,true,false);
      coverDraw(tctx,bgs[i].img,x,y,w,h);
      tctx.restore();
    }
    tctx.restore();
  }
  if($("thumbDark").checked){tctx.fillStyle="rgba(0,0,0,.28)";tctx.fillRect(0,0,1280,720);}
  if($("thumbVignette").checked)drawVignette(tctx);

  // accents
  tctx.save();
  tctx.globalAlpha=.9;
  tctx.fillStyle="rgba(255,152,0,.9)";
  tctx.beginPath();tctx.moveTo(0,0);tctx.lineTo(360,0);tctx.lineTo(0,220);tctx.closePath();tctx.fill();
  tctx.fillStyle="rgba(255,230,0,.85)";
  tctx.beginPath();tctx.moveTo(1280,720);tctx.lineTo(900,720);tctx.lineTo(1280,500);tctx.closePath();tctx.fill();
  tctx.restore();

  // assets
  if(assets.length){
    const main=assets[0].img;
    if(tpl==="leftCharacter"){
      containDraw(tctx,main,30,115,470,590);
    }else if(tpl==="centerCharacter"){
      containDraw(tctx,main,390,90,500,620);
    }else{
      containDraw(tctx,main,35,235,360,460);
    }
    for(let i=1;i<assets.length;i++){
      const size=i===1?170:130;
      const x=1080-(i-1)*150, y=30;
      containDraw(tctx,assets[i].img,x,y,size,size);
    }
  }

  // text
  const small=$("smallText").value.trim(), main=$("mainText").value.trim(), sub=$("subText").value.trim(), name=$("nameText").value.trim();
  if(tpl==="leftCharacter"){
    drawLabel(tctx,small,520,40,300,70,"#ff6a00");
    drawTextFit(tctx,sub,520,130,680,58,34,"#fff","#111");
    drawTextFit(tctx,main,520,220,700,96,54,"#ffe600","#111");
    drawTextFit(tctx,name,520,615,680,54,30,"#fff","#111");
  }else if(tpl==="centerCharacter"){
    drawLabel(tctx,small,45,45,270,68,"#ff6a00");
    drawTextFit(tctx,sub,60,135,500,56,32,"#fff","#111");
    drawTextFit(tctx,main,60,515,1160,92,52,"#ffe600","#111","left");
    drawTextFit(tctx,name,790,55,430,50,28,"#fff","#111");
  }else{
    drawLabel(tctx,small,40,40,270,68,"#ff6a00");
    drawTextFit(tctx,sub,390,60,780,62,34,"#fff","#111");
    drawTextFit(tctx,main,390,520,830,96,52,"#ffe600","#111");
    drawTextFit(tctx,name,45,630,470,46,26,"#fff","#111");
  }

  $("thumbStatus").textContent="サムネを作成しました。別パターンも試せます。";
}
$("makeThumb").onclick=makeThumbnail;
$("randomizeThumb").onclick=()=>{thumbSeed++;makeThumbnail();};
$("downloadThumb").onclick=()=>{
  const a=document.createElement("a");
  a.download="alrod_thumbnail.png";
  a.href=thumbCanvas.toDataURL("image/png");
  a.click();
};
</script>
